name: Dependency advisories

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Each call fetches RustSec's current database; fail on warnings as well.
      - name: Audit library dependencies
        run: cargo audit --deny warnings
      - name: Audit fuzz dependencies
        run: cargo audit --file fuzz/Cargo.lock --deny warnings
