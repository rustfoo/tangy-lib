name: Build and Run

on: [push, pull_request]

jobs:
  rust-stable:
    runs-on: ubuntu-latest
    
    steps:
    
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Build & Test
      run: |
        cargo fmt --check
        cargo check --locked --all-targets
        cargo build --locked --release
        cargo test --locked

  rust-stable-windows:
    runs-on: windows-latest
    
    steps:
    
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Build & Test
      run: |
        cargo check --locked --all-targets
        cargo build --locked --release
        cargo test --locked


  rust-msrv:
    runs-on: ubuntu-latest
    
    steps:
    
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.85.1

    - name: Build & Test
      run: |
        cargo check --locked --all-targets
        cargo build --locked --release
        cargo test --locked

  clevis-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install interoperability tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clevis jose python3 curl
    - name: Check independent fixtures and Clevis recovery
      run: |
        python3 scripts/check-fixtures.py
        cargo test --locked --features interop --test clevis
