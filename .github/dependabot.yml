version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The versioned ref tests our MSRV; @stable jobs track the latest compiler.
      # Raise the MSRV deliberately alongside Cargo.toml's rust-version.
      - dependency-name: dtolnay/rust-toolchain
