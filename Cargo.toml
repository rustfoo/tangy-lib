[package]
name = "tangy-lib"
description = "Tang protocol library implementation"
version = "0.2.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Martyn P <martyn@datasync.dev>"]
repository = "https://github.com/martynp/tangy-lib"
readme = "README.md"

[features]
# Opt-in tests requiring Clevis, JOSE, Python 3, and loopback networking.
interop = []

[[test]]
name = "clevis"
required-features = ["interop"]

[dependencies]
p521 = { version = ">=0.13.3", features = ["ecdh", "ecdsa", "jwk"] }
elliptic-curve = { version = "0.13.8", features = ["jwk"] }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64ct = "1.8"
sha2 = "0.10"
thiserror = "2"
rand_chacha = "0.3"

[dev-dependencies]
tempfile = "3"
