[package]
name = "tangy-lib"
description = "Tang protocol library implementation"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Martyn P <martyn@datasync.dev>"]
repository = "https://github.com/martynp/tangy-lib"
readme = "README.md"

[features]
# Opt-in tests requiring Clevis, JOSE, Python 3, and loopback networking.
interop = []

[[test]]
name = "clevis"
required-features = ["interop"]

[dependencies]
p521 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "precomputed-tables"] }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64ct = { version = "1.8", features = ["alloc"] }
sha2 = "0.11"
thiserror = "2"
rand_chacha = "0.10"
getrandom = { version = "0.4", features = ["std"] }
zeroize = { version = "1.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
